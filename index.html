<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business POS & Inventory Pro Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Hind Siliguri', sans-serif;
        }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 80mm;
                padding: 10px;
                background: white;
            }
            .no-print { display: none !important; }
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

<div id="auth-container" class="flex-grow flex items-center justify-center p-4">

    <div id="login-card" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <div class="text-center mb-8">
            <span class="bg-indigo-100 text-indigo-600 px-3 py-1 rounded-full text-xs font-semibold uppercase">POS PRO v2.0</span>
            <h2 class="text-3xl font-bold mt-2">Log in</h2>
            <p class="text-sm text-slate-500 mt-1">Sign in to your account</p>
        </div>
        <div class="space-y-4">
            <input id="login-username" placeholder="Username" class="w-full p-3 border rounded-lg" />
            <input id="login-password" type="password" placeholder="Password" class="w-full p-3 border rounded-lg" />
            <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white p-3 rounded-lg">Login</button>
        </div>
        <p class="text-center mt-4 text-sm">New business? <button onclick="toggleAuth(false)" class="text-indigo-600">Create account</button></p>
    </div>

    <div id="signup-card" class="hidden bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border">
        <h2 class="text-2xl font-bold mb-4">Sign up</h2>
        <input id="reg-company" placeholder="Company Name" class="w-full p-2 border mb-2 rounded" />
        <input id="reg-logo" placeholder="Logo URL" class="w-full p-2 border mb-2 rounded" />
        <input id="reg-category" placeholder="Category" class="w-full p-2 border mb-2 rounded" />
        <input id="reg-username" placeholder="Username" class="w-full p-2 border mb-2 rounded" />
        <input id="reg-password" type="password" placeholder="Password" class="w-full p-2 border mb-2 rounded" />
        <div class="flex items-center justify-between bg-slate-100 p-2 rounded mb-2">
            <span id="captcha-display" class="font-bold"></span>
            <input id="captcha-input" placeholder="Captcha" class="w-24 p-1 border rounded" />
        </div>
        <button onclick="handleSignup()" class="w-full bg-green-600 text-white p-2 rounded">Create Account</button>
        <p class="text-center mt-2 text-sm">Already have account? <button onclick="toggleAuth(true)" class="text-indigo-600">Login</button></p>
    </div>

</div>

<div id="app-container" class="hidden flex-grow flex flex-col md:flex-row">

<aside class="w-64 bg-slate-900 text-white p-4 no-print">
    <h2 id="app-company-name">My Company</h2>
    <p id="app-username" class="text-sm text-slate-300"></p>
</aside>

<main class="flex-grow p-6">

<!-- POS TAB -->
<div id="tab-pos">
    <h1>POS System</h1>
</div>

<!-- INVENTORY -->
<div id="tab-inventory" class="hidden">
    <h1>Inventory Management</h1>
    <input id="inv-name" placeholder="Product Name" class="border p-2" />
    <input id="inv-qty" placeholder="Stock Quantity" class="border p-2" />
    <input id="inv-buy" placeholder="Buy Price" class="border p-2" />
    <input id="inv-sell" placeholder="Sell Price" class="border p-2" />
    <button onclick="handleSaveProduct()">Add Product</button>

    <table class="w-full mt-4">
        <thead>
            <tr>
                <th>Name</th><th>Stock</th><th>Buy</th><th>Sell</th><th>Gift</th><th>Action</th>
            </tr>
        </thead>
        <tbody id="inventory-table-body"></tbody>
    </table>
</div>

<!-- STATEMENT -->
<div id="tab-statement" class="hidden">
    <h1>Statements</h1>
</div>

</main>
</div>

<script>
let dbUsers = JSON.parse(localStorage.getItem('pos_users')) || {};
let activeUser = null;
let captchaCode = '';
let cart = [];

function toggleAuth(showLogin){
 document.getElementById('login-card').classList.toggle('hidden', !showLogin);
 document.getElementById('signup-card').classList.toggle('hidden', showLogin);
}

function handleSignup(){
 const company=document.getElementById('reg-company').value.trim();
 const username=document.getElementById('reg-username').value.trim();
 const password=document.getElementById('reg-password').value.trim();
 const captcha=document.getElementById('captcha-input').value.trim();

 if(!company||!username||!password){
  alert('Please provide company name, username and password.');return;
 }
 if(dbUsers[username]){alert('Username already exists!');return;}

 dbUsers[username]={username,password,company,inventory:[],statements:[]};
 localStorage.setItem('pos_users',JSON.stringify(dbUsers));
 alert('Account created successfully! Please login.');
 toggleAuth(true);
}

function handleLogin(){
 const u=document.getElementById('login-username').value;
 const p=document.getElementById('login-password').value;
 if(dbUsers[u]&&dbUsers[u].password===p){
  activeUser=u;
  localStorage.setItem('pos_active_user',u);
  document.getElementById('auth-container').classList.add('hidden');
  document.getElementById('app-container').classList.remove('hidden');
 }else{
  alert('Incorrect username or password');
 }
}

function handleSaveProduct(){
 const name=document.getElementById('inv-name').value;
 const qty=parseFloat(document.getElementById('inv-qty').value);
 const buy=parseFloat(document.getElementById('inv-buy').value);
 const sell=parseFloat(document.getElementById('inv-sell').value);

 if(!name||isNaN(qty)){
  alert('Please provide correct product information');return;
 }

 dbUsers[activeUser].inventory.push({name,qty,buy,sell});
 localStorage.setItem('pos_users',JSON.stringify(dbUsers));
 alert('Product added successfully');
}

</script>

</body>
</html>
